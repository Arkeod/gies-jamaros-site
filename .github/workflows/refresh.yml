name: Refresh GIES site

# DISABLED 2026-04-30: cron handled by Cloudflare Worker (tools/cf-worker/) instead.
# GitHub Actions Azure IPs are blocked by Substack/Cloudflare, even for RSS.
# Manual trigger kept for emergency override.
on:
  workflow_dispatch:

permissions:
  contents: write           # so the job can commit the regenerated HTML back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run refresh + deploy
        env:
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python tools/refresh.py --deploy

      - name: Commit regenerated HTML
        run: |
          git config user.name "gies-refresh-bot"
          git config user.email "gies-refresh-bot@users.noreply.github.com"
          git add index.html research/index.html img/issues/ tools/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh content $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
