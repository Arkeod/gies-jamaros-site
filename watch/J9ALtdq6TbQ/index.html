<h2><span class="sq"></span>The question</h2>
<p>Capcom has been the franchise-management benchmark across 2020 to 2026: Resident Evil 2 Remake, RE3 Remake, RE Village, RE4 Remake, and Monster Hunter Wilds all hit or exceeded internal targets. Resident Evil Requiem is the next mainline franchise entry. The question is whether it lands in the 5 to 8 million unit band that Capcom has built recent franchise economics around.</p>

<h2><span class="sq"></span>Key points from the short</h2>
<ul>
  <li><strong>Capcom franchise hit-rate is exceptional.</strong> RE2 Remake (14 million), RE Village (12 million), RE4 Remake (10 million) all crossed conservative ship targets. <em style="color:var(--red);font-style:normal;font-family:'SF Mono',Menlo,monospace;font-size:0.72rem;letter-spacing:0.06em">FACT</em></li>
  <li><strong>Estimated Requiem budget: $80 to $120 million</strong>, in line with RE Village production scope. <em style="color:var(--red);font-style:normal;font-family:'SF Mono',Menlo,monospace;font-size:0.72rem;letter-spacing:0.06em">ASSUMPTION (T4 leak-based)</em></li>
  <li><strong>Break-even sell-through:</strong> roughly 4 million units at $70, before marketing recovery. <em style="color:var(--red);font-style:normal;font-family:'SF Mono',Menlo,monospace;font-size:0.72rem;letter-spacing:0.06em">ASSUMPTION</em></li>
  <li><strong>Watch:</strong> launch-month sell-through, day-one sales mix between physical and digital, and PC vs PS5 attach split. <em style="color:var(--red);font-style:normal;font-family:'SF Mono',Menlo,monospace;font-size:0.72rem;letter-spacing:0.06em">ASSUMPTION-GUIDED watch</em></li>
</ul>
